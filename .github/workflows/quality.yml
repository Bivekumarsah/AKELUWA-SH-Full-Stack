name: Monorepo quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/akeluwa-monorepo-2026-10
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  company-toolbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/company/package-lock.json
      - name: Validate shared source symlinks
        run: |
          test -L toolbox && test -f toolbox/index.html
          test -L backend && test -f backend/go.mod
          test -L docs && test -f docs/ARCHITECTURE.md
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run deploy:frontend:dry-run
      - run: npm run audit:production
      - name: Validate deployment files
        run: |
          sh -n ../../infrastructure/legacy-api-stack/backup-db.sh ../../infrastructure/legacy-api-stack/verify-backup.sh
          docker compose --env-file ../../infrastructure/legacy-api-stack/.env.example -f ../../infrastructure/legacy-api-stack/compose.prod.yaml config --quiet
          docker compose --env-file ../../infrastructure/lightsail/env.sample -f ../../infrastructure/lightsail/compose.yaml config --quiet

  publicinfohub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/publicinfohub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: |
          node --check app.js
          node --check data.js
          node --check i18n.js
          node --check offices.js
          node --check utilities/utility.js

  go-api:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akeluwa_test
          POSTGRES_USER: akeluwa_test
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akeluwa_test -d akeluwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://akeluwa_test:integration-test-password@localhost:5432/akeluwa_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akeluwa_test
          POSTGRES_USER: akeluwa_test
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akeluwa_test -d akeluwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://akeluwa_test:integration-test-password@localhost:5432/akeluwa_test?sslmode=disable
      JWT_SECRET: full-stack-ci-jwt-secret-please-replace-in-production
      MFA_ENCRYPTION_KEY: full-stack-ci-mfa-secret-please-replace-in-production
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:5173
      FULL_STACK_API_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/company/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: npm ci
        working-directory: apps/company
      - run: go run ./cmd/api > "$RUNNER_TEMP/api.log" 2>&1 &
        working-directory: services/api
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/readyz > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: apps/company
      - run: npx playwright test tests/browser/full-stack.spec.ts
        working-directory: apps/company

  django-local-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/pdf-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
