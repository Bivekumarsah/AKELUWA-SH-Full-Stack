services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: akeluwa
      POSTGRES_USER: akeluwa
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5432:5432"
    volumes:
      - akeluwa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akeluwa -d akeluwa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://akeluwa:local-development-password@postgres:5432/akeluwa?sslmode=disable
      JWT_SECRET: local-only-secret-change-before-production
      JWT_ISSUER: akeluwa-api
      SESSION_TTL: 24h
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      TRUST_PROXY_HEADERS: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174
      ADMIN_NAME: AKELUWA Administrator
      ADMIN_EMAIL: admin@localhost.test
      ADMIN_PASSWORD: change-this-admin-password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  akeluwa_postgres:
