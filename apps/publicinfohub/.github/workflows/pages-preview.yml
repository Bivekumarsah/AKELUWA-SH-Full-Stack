name: PublicInfoHub GitHub Pages preview

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicinfohub-pages-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run directory and link tests
        run: |
          node --test tests/*.test.mjs
          node --check app.js
          node --check share.js
          node --check i18n.js
      - name: Prepare isolated, no-index preview
        run: node scripts/build-pages-preview.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
